; ayu-dark — fast-syntax-highlighting theme
; Palette: https://github.com/ayu-theme/ayu-colors
; Matched to colors/ayu-dark.lua, ayu-dark.tmuxtheme and ayu-dark.zsh-theme.
; Apply with: fast-theme XDG:ayu-dark

[base]
default          = none
unknown-token    = #D95757,bold
commandseparator = #F29668
redirection      = #F29668
here-string-tri  = #95E6CB
here-string-text = bg:#0F131A
here-string-var  = #D2A6FF,bg:#0F131A
exec-descriptor  = #FF8F40,bold
comment          = #636A72
correct-subtle   = #636A72
incorrect-subtle = #D95757
subtle-separator = #565B66
subtle-bg        = bg:#131721
; theme used inside $( ... ) and eval arguments
secondary        = XDG:ayu-dark
recursive-base   = #BFBDB6

[command-point]
reserved-word  = #FF8F40
subcommand     = #FFB454
alias          = #FFB454
suffix-alias   = #FFB454
global-alias   = #FFB454,bg:#131721
builtin        = #FFB454
function       = #FFB454
command        = #FFB454
precommand     = #FF8F40
hashed-command = #FFB454
single-sq-bracket = #FFB454
double-sq-bracket = #FFB454
double-paren   = #FF8F40

[paths]
path          = #59C2FF
pathseparator =
path-to-dir   = #59C2FF,underline
globbing      = #D2A6FF
globbing-ext  = #D2A6FF,bold

[brackets]
paired-bracket  = bg:#1A3049
bracket-level-1 = #E6B450,bold
bracket-level-2 = #39BAE6,bold
bracket-level-3 = #D2A6FF,bold

[arguments]
single-hyphen-option   = #E6B450
double-hyphen-option   = #E6B450
back-quoted-argument   = none
single-quoted-argument = #AAD94C
double-quoted-argument = #AAD94C
dollar-quoted-argument = #AAD94C
optarg-string          = #AAD94C
optarg-number          = #D2A6FF

[in-string]
; backslash in $'...'
back-dollar-quoted-argument           = #95E6CB
; backslash or $... in "..."
back-or-dollar-double-quoted-argument = #95E6CB

[other]
variable             = #D2A6FF
assign               = none
assign-array-bracket = #F29668
history-expansion    = #D2A6FF,bold

[math]
mathvar = #D2A6FF
mathnum = #D2A6FF
matherr = #D95757,bold

[for-loop]
forvar = #D2A6FF
fornum = #D2A6FF
; operator
foroper = #F29668
; separator
forsep = #565B66

[case]
case-input       = #D2A6FF
case-parentheses = #F29668
case-condition   = bg:#131721
